services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: memberflow
      POSTGRES_PASSWORD: memberflow
      POSTGRES_DB: memberflow
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U memberflow']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
